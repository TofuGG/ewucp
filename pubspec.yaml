name: ewucp
description: "A course planner for university student and friends class management"
publish_to: 'none'
version: 1.3.0+1

environment:
  sdk: ">=2.17.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.4
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2
  pdf: ^3.11.3
  printing: ^5.11.0
  flutter_native_splash: ^2.4.2
  file_picker: ^10.3.1
  permission_handler: ^11.3.0
  excel: ^4.0.6
  spreadsheet_decoder: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"

flutter_native_splash:
  color: "#263238"
  image: assets/icon.png
  android: true
  ios: true